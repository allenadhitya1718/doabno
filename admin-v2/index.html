<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <title>DOABNO Admin</title>
  <meta name="theme-color" content="#0E2A47">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/doabno-app-icon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/brand/doabno-app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/brand/doabno-tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <section class="login" id="login" hidden>
    <div class="login-card">
      <img src="assets/brand/doabno-logo-primary.svg" alt="DOABNO" width="188" height="36" class="login-logo">
      <h1 data-i18n="login.title">Admin portal</h1>
      <p class="muted" data-i18n="login.sub">Sign in to manage products, stores and offers.</p>
      <form id="loginForm" class="form-stack">
        <label class="field"><span data-i18n="login.email">Work email</span><input type="email" name="email" required autocomplete="username"></label>
        <label class="field"><span data-i18n="login.password">Password</span><input type="password" name="password" required autocomplete="current-password"></label>
        <p class="form-err" id="loginErr" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">Sign in</button>
      </form>
      <p class="hint" id="loginHint" data-i18n="login.demo">Demo: any email and password work.</p>
      <button type="button" class="lang-toggle link">العربية</button>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <button type="button" class="side-brand" id="sideToggle" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar">
        <span class="side-mark"><img src="assets/brand/doabno-app-icon.svg" alt="" width="40" height="40"></span>
        <span class="side-brand-t"><small data-i18n="side.portal">Admin portal</small><strong>DOABNO</strong></span>
        <svg class="side-fold" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <form class="side-search" id="sideSearch" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M11 4a7 7 0 110 14 7 7 0 010-14zM20 20l-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="search" name="q" id="sideQ" autocomplete="off" data-i18n-ph="side.search" data-i18n-label="side.search" placeholder="Search products…" aria-label="Search products">
      </form>
      <nav class="nav" id="nav" data-i18n-label="side.nav" aria-label="Admin"></nav>
      <div class="side-promo">
        <strong data-i18n="side.siteTitle">See it live</strong>
        <p data-i18n="side.siteText">Check how stores and offers look to shoppers on the site.</p>
        <a class="side-promo-btn" href="../" target="_blank" rel="noopener">
          <span data-i18n="side.viewSite">View site</span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <div class="user side-user">
        <button type="button" class="user-btn" id="userBtn" aria-expanded="false" aria-controls="userMenu" aria-haspopup="true">
          <span class="avatar" id="userAvatar">A</span>
          <span class="user-t"><strong class="user-name" id="userName">Admin</strong><small data-i18n="side.role">Administrator</small></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="user-menu" id="userMenu" hidden>
          <a href="../" target="_blank" rel="noopener" data-i18n="side.viewSite">View site</a>
          <button type="button" data-logout data-i18n="top.signOut">Sign out</button>
        </div>
      </div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop" data-close-menu></div>

    <div class="workspace">
      <header class="topbar">
        <button type="button" class="top-ic menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sidebar" data-i18n-label="top.menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <nav class="crumbs" data-i18n-label="crumb.root" aria-label="Breadcrumb">
          <a href="#/" data-i18n="crumb.root">DOABNO Admin</a>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="crumbHere" aria-current="page">Dashboard</span>
        </nav>
        <div class="top-right">
          <label class="top-market"><span data-i18n="top.market">Market</span><select id="marketSel"></select></label>
          <button type="button" class="lang-toggle top-lang">العربية</button>
          <a class="top-ic solid" href="#/feeds" data-i18n-label="attn.title" aria-label="Needs attention">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4l2-2zM10 20a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <b class="top-dot" id="bellDot" hidden></b>
          </a>
          <a class="top-ic top-settings" href="#/settings" data-i18n-label="nav.settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM15 12a3 3 0 11-6 0 3 3 0 016 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" data-close-drawer hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <header class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button type="button" class="icon-btn" data-close-drawer data-i18n-label="act.close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
    <footer class="drawer-foot">
      <button type="button" class="btn btn-ghost" data-close-drawer data-i18n="act.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="drawerSave" data-i18n="act.save">Save</button>
    </footer>
  </aside>

  <div class="dialog" id="dialog" hidden>
    <div class="dialog-card" role="alertdialog" aria-modal="true" aria-describedby="dialogText">
      <p id="dialogText"></p>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-dialog-cancel data-i18n="act.cancel">Cancel</button>
        <button type="button" class="btn btn-danger-solid" id="dialogOk">OK</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/config.js"></script>
  <script src="assets/boot.js" data-scripts="assets/data.js,assets/account.js,admin-db.js,admin-i18n.js,admin.js"></script>
</body>
</html>

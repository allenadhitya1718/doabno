<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DOABNO Admin</title>
  <meta name="theme-color" content="#0E2A47">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/doabno-app-icon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/brand/doabno-app-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/brand/doabno-tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <section class="login" id="login" hidden>
    <div class="login-card">
      <img src="assets/brand/doabno-logo-primary.svg" alt="DOABNO" width="188" height="36" class="login-logo">
      <h1 data-i18n="login.title">Admin portal</h1>
      <p class="muted" data-i18n="login.sub">Sign in to manage products, stores and offers.</p>
      <form id="loginForm" class="form-stack">
        <label class="field"><span data-i18n="login.email">Work email</span><input type="email" name="email" required autocomplete="username"></label>
        <label class="field"><span data-i18n="login.password">Password</span><input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">Sign in</button>
      </form>
      <p class="hint" data-i18n="login.demo">Demo: any email and password work.</p>
      <button type="button" class="lang-toggle link">العربية</button>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a href="#/" class="side-logo"><img src="assets/brand/doabno-logo-reverse.svg" alt="DOABNO" width="150" height="29"><span data-i18n="side.admin">Admin</span></a>
      <nav class="nav" id="nav" data-i18n-label="side.nav" aria-label="Admin"></nav>
      <div class="side-foot">
        <a href="../" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="side.viewSite">View site</span>
        </a>
        <p data-i18n="side.demo">Demo data. Changes are saved in this browser.</p>
      </div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop" data-close-menu></div>

    <div class="workspace">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sidebar" data-i18n-label="top.menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <label class="top-market"><span data-i18n="top.market">Market</span><select id="marketSel"></select></label>
        <div class="top-right">
          <button type="button" class="lang-toggle link">العربية</button>
          <div class="user">
            <button type="button" class="user-btn" id="userBtn" aria-expanded="false" aria-controls="userMenu" aria-haspopup="true">
              <span class="avatar" id="userAvatar">A</span><span class="user-name" id="userName">Admin</span>
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="user-menu" id="userMenu" hidden>
              <a href="../" target="_blank" rel="noopener" data-i18n="side.viewSite">View site</a>
              <button type="button" data-logout data-i18n="top.signOut">Sign out</button>
            </div>
          </div>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" data-close-drawer hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <header class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button type="button" class="icon-btn" data-close-drawer data-i18n-label="act.close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
    <footer class="drawer-foot">
      <button type="button" class="btn btn-ghost" data-close-drawer data-i18n="act.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="drawerSave" data-i18n="act.save">Save</button>
    </footer>
  </aside>

  <div class="dialog" id="dialog" hidden>
    <div class="dialog-card" role="alertdialog" aria-modal="true" aria-describedby="dialogText">
      <p id="dialogText"></p>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-dialog-cancel data-i18n="act.cancel">Cancel</button>
        <button type="button" class="btn btn-danger-solid" id="dialogOk">OK</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/data.js"></script>
  <script src="admin-i18n.js"></script>
  <script src="admin.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOABNO App · Prototype</title>
<link rel="icon" href="app/assets/brand/doabno-app-icon-32.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2a2a; }
  body { font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  /* the phone is drawn at real size (360 x 780 screen) and scaled as a whole to fit the window */
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .device { position: relative; flex: none; width: 384px; height: 804px; box-sizing: border-box; padding: 12px; border-radius: 54px;
    background: #050505; transform-origin: center center;
    box-shadow: inset 0 0 0 1px #1c1c1c, 0 0 0 2px #b9c0c8, 0 0 0 3px #e3e7eb, 0 0 0 4.5px #7b838c, 0 0 0 5.5px #3b4046, 0 28px 70px rgba(0, 0, 0, .6); }
  .btn { position: absolute; right: -8px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, #6f7780, #c7cdd3 60%, #8a929b); }
  .btn.vol { top: 168px; height: 92px; } .btn.pwr { top: 292px; height: 58px; }
  .screen { position: relative; width: 360px; height: 780px; border-radius: 42px; overflow: hidden; background: #000; display: flex; flex-direction: column; }
  .status { flex: none; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 2px 26px 0; color: #fff; font-size: 13px; font-weight: 600; background: #000; }
  .status .r { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .status svg { display: block; }
  .cam { position: absolute; top: 11px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #111; box-shadow: inset 0 0 0 2.5px #222, 0 0 0 1px #000; z-index: 2; }
  iframe { flex: 1; display: block; width: 360px; border: 0; background: #fff; }
  .home { flex: none; height: 22px; background: #000; display: flex; align-items: center; justify-content: center; }
  .home i { width: 108px; height: 4px; border-radius: 4px; background: #e9e9e9; }
  /* on a real phone: no frame, the app fills the screen */
  @media (max-width: 520px) {
    html, body { background: #fff; }
    .stage { display: block; }
    .device { width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; transform: none !important; background: none; }
    .btn, .status, .cam, .home { display: none; }
    .screen { width: 100%; height: 100%; border-radius: 0; }
    iframe { width: 100%; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <span class="btn vol"></span><span class="btn pwr"></span>
      <div class="screen">
        <span class="cam"></span>
        <div class="status">
          <span id="t">9:41</span>
          <span class="r">
            <svg width="16" height="11" viewBox="0 0 16 11" fill="#fff"><rect x="0" y="8" width="3" height="3" rx=".6"/><rect x="4.3" y="5.5" width="3" height="5.5" rx=".6"/><rect x="8.6" y="3" width="3" height="8" rx=".6"/><rect x="12.9" y="0" width="3" height="11" rx=".6"/></svg>
            100%
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x=".5" y=".5" width="18.5" height="10" rx="2.5" stroke="#fff" opacity=".6"/><rect x="2" y="2" width="15.5" height="7" rx="1.4" fill="#fff"/><rect x="20" y="3.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".6"/></svg>
          </span>
        </div>
        <iframe src="app/index.html" title="DOABNO app prototype"></iframe>
        <div class="home"><i></i></div>
      </div>
    </div>
  </div>
<script>
  (function () {
    var d = new Date(), h = d.getHours(), m = ('0' + d.getMinutes()).slice(-2);
    document.getElementById('t').textContent = ((h % 12) || 12) + ':' + m + (h < 12 ? ' AM' : ' PM');
    var dev = document.getElementById('device');
    function fit() {
      if (innerWidth <= 520) { dev.style.transform = ''; return; }
      var s = Math.min(1.1, (innerHeight - 36) / 812, (innerWidth - 36) / 392);
      dev.style.transform = 'scale(' + s + ')';
    }
    addEventListener('resize', fit); fit();
    // hide the app's scrollbars so the screen looks like a phone
    var f = document.querySelector('iframe');
    f.addEventListener('load', function () {
      try { var s = f.contentDocument.createElement('style'); s.textContent = 'html,body,*{scrollbar-width:none}::-webkit-scrollbar{display:none}'; f.contentDocument.head.appendChild(s); } catch (e) {}
    });
  })();
</script>
</body>
</html>

name: Android build

# Builds the DOABNO Android app (Capacitor wrapper around app-v2) on a Linux runner and attaches the APK (and a signed AAB for Google Play
# when the signing secrets exist) to the run. One-time setup for Google Play: android-app/README.md. Secrets are only passed through env: and are never echoed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown to users (for example 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.doabno.app' }}
      APP_VERSION: ${{ inputs.version }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the version
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "version must look like 1.0.0"; exit 1; }

      - name: Build the web app and copy it into the Android project
        run: |
          node scripts/build-site.js
          mkdir -p android-app/www
          cp -R dist/app/. android-app/www/

      - name: Create the Android project
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: App icon
        working-directory: android-app
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0E2A47' --iconBackgroundColorDark '#0E2A47'

      - name: Permissions, version and Firebase file
        working-directory: android-app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # camera for the barcode scanner (optional hardware), notifications for price alerts (Android 13 and newer)
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <queries><intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent></queries>\n    <application#' "$MANIFEST"
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" "$GRADLE"
          grep -nE "versionCode|versionName|applicationId" "$GRADLE"
          grep -n "uses-permission\|uses-feature" "$MANIFEST"
          # push notifications need the Firebase file of the project (optional; without it the app still builds and runs, only push is off)
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json; echo "Firebase file added"; else echo "No Firebase file: push notifications stay off"; fi

      - name: Build the debug APK (installs on any phone)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build the signed release files (only when the signing secrets exist)
        working-directory: android-app/android
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "No signing secrets: skipping the release build (the debug APK is still attached)."; exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
          ./gradlew --no-daemon bundleRelease assembleRelease $SIGN
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: doabno-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: doabno-release-aab
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: doabno-release-apk
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

name: iOS to TestFlight

# Builds the DOABNO iOS app (Capacitor wrapper around app-v2) on a macOS runner and uploads it to TestFlight.
# One-time setup: ios-app/README.md. Secrets are only passed through env: and are never echoed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in TestFlight (for example 1.0.0)"
        required: false
        default: "1.0.0"
      push:
        description: "Turn on the Push Notifications capability (signs the archive with the App Store Connect key). Also on automatically when the APNS_KEY_P8 secret exists."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_VERSION: ${{ inputs.version }}
      PUSH: ${{ inputs.push == true || secrets.APNS_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the one-time setup
        run: |
          missing=""
          for v in BUNDLE_ID APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Missing setting(s):$missing. See ios-app/README.md."; exit 1; fi
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "version must look like 1.0.0"; exit 1; }

      - name: Build the web app and copy it into the iOS project
        run: |
          node scripts/build-site.js
          mkdir -p ios-app/www
          cp -R dist/app/. ios-app/www/

      - name: Use Xcode 26 (Apple requires the iOS 26 SDK for App Store Connect uploads)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$MAJOR" -ge 26 ] || { echo "Xcode $MAJOR is too old: Apple needs Xcode 26 or later"; exit 1; }

      - name: Create the iOS project
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Show the bundle ids in the project
        working-directory: ios-app
        run: |
          grep -h "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj | sort | uniq -c
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/App/App.xcodeproj/project.pbxproj || { echo "The app target does not have the bundle id $BUNDLE_ID"; exit 1; }

      - name: App icon, name and Info.plist
        working-directory: ios-app
        run: |
          cp assets/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName DOABNO" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string DOABNO uses the camera to scan product barcodes." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription DOABNO uses the camera to scan product barcodes." "$PLIST"

      - name: Push Notifications entitlement
        if: env.PUSH == 'true'
        working-directory: ios-app
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>aps-environment</key><string>production</string>
          </dict></plist>
          EOF
          PBX=ios/App/App.xcodeproj/project.pbxproj
          # add the entitlements file to the app target's build settings (both Debug and Release)
          perl -0pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = \Q$ENV{BUNDLE_ID}\E;)/$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' "$PBX"
          grep -n "CODE_SIGN_ENTITLEMENTS" "$PBX"

      - name: Save the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive (unsigned; signing happens at export)
        working-directory: ios-app/ios/App
        run: |
          # Capacitor 7 uses CocoaPods (a workspace); newer versions may use Swift Package Manager (a project only).
          if [ -d App.xcworkspace ]; then TARGET=(-workspace App.xcworkspace); else TARGET=(-project App.xcodeproj); fi
          COMMON=(-scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}")
          if [ "$PUSH" = "true" ]; then
            # Signed here (automatic signing through the App Store Connect key), so the push entitlement is embedded in the app.
            xcodebuild archive "${TARGET[@]}" "${COMMON[@]}" CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          else
            xcodebuild archive "${TARGET[@]}" "${COMMON[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export and upload to TestFlight
        working-directory: ios-app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

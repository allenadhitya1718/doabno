<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E2A47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DOABNO app</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/doabno-app-icon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/brand/doabno-app-icon.svg">
  <link rel="apple-touch-icon" href="assets/brand/doabno-app-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/brand/doabno-tokens.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="stage">
    <aside class="demo-panel">
      <img class="demo-logo" src="assets/brand/doabno-logo-primary.svg" alt="DOABNO" width="157" height="30">
      <h1 data-i18n="demo.title">DOABNO mobile app</h1>
      <p data-i18n="demo.sub">App layout for iPhone and Android.</p>
      <h2 data-i18n="demo.screens">Jump to a screen</h2>
      <div class="demo-screens" id="demoScreens"></div>
      <h2 data-i18n="demo.states">Preview states</h2>
      <div class="demo-states"><button type="button" data-simulate-error data-i18n="demo.error">Error state</button><button type="button" data-simulate-loading data-i18n="demo.loading">Loading state</button></div>
      <div class="demo-links">
        <button type="button" class="lang-toggle">English</button>
        <a href="../" target="_blank" rel="noopener" data-i18n="demo.website">Website</a>
        <a href="../admin/" target="_blank" rel="noopener" data-i18n="demo.admin">Admin portal</a>
      </div>
      <p class="demo-note" data-i18n="demo.phone">Open this page on your phone to see the app full screen.</p>
      <p class="demo-note" data-i18n="demo.shared">Favorites, price alerts and settings are shared with the website in this browser.</p>
    </aside>

    <div class="device-wrap" id="deviceWrap">
      <div class="device" id="device">
        <div class="device-frame">
          <div class="island" aria-hidden="true"></div>
          <div class="app" id="app">
            <div class="statusbar" aria-hidden="true">
              <span>9:41</span>
              <span>
                <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="6" width="3" height="6" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
                <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0114 0M4.5 7.5a5.7 5.7 0 018 0"/><circle cx="8.5" cy="10.5" r="1.3" fill="currentColor" stroke="none"/></svg>
                <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 000-4z" fill="currentColor" opacity=".4"/></svg>
              </span>
            </div>
            <header class="appbar" id="appbar"></header>
            <main class="screen" id="screen" tabindex="-1"></main>
            <nav class="tabbar" id="tabbar" aria-label="DOABNO"></nav>
            <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
            <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
            <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/boot.js" data-scripts="assets/i18n.js,assets/data.js,mobile-i18n.js,mobile.js"></script>
</body>
</html>

# Settings the Supabase command line tool reads when deploying from backend/ (supabase functions deploy go).
project_id = "doabno"

# "go" is the public "Visit store" link: shoppers are not signed in, so it must not demand a login token.
[functions.go]
verify_jwt = false

# "identify" turns a photo into a product guess with Gemini. The app calls it with the public key; the function checks that key itself (so the browser's
# preflight request, which carries no token, works), and keeps GEMINI_API_KEY as a project secret.
[functions.identify]
verify_jwt = false
